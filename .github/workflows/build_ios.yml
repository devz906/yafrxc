name: Build iPhone 16 Pro EXE Loader
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Reassemble Engine (Safe Zone)
        run: |
          mkdir -p ../FINAL_ENGINE_INJECTION
          cat EngineParts/wine_parts.* > wine_engine.zip
          unzip -q wine_engine.zip -d ../FINAL_ENGINE_INJECTION
          find ../FINAL_ENGINE_INJECTION -name "Info.plist" -delete
        
      - name: Build Bare-Metal Shell
        run: |
          cd Shell
          # Wipe DerivedData locally in the runner to kill the bad bundle accessor
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          
          xcodebuild archive \
            -scheme WineKit \
            -destination "generic/platform=iOS" \
            -archivePath ../WineKit.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=18.0 \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
      - name: Final App Assembly
        run: |
          mkdir -p Payload
          APP_PATH=$(find WineKit.xcarchive -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          APP_NAME=$(basename "$APP_PATH")
          
          # MANUALLY create the wine folder inside the .app bundle
          mkdir -p "Payload/$APP_NAME/wine"
          cp -r ../FINAL_ENGINE_INJECTION/* "Payload/$APP_NAME/wine/"
          
          zip -r WineKit.ipa Payload
          
      - name: Upload A18 Pro IPA
        uses: actions/upload-artifact@v4
        with:
          name: WineKit-A18-Pro
          path: WineKit.ipa
