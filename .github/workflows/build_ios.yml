name: Build iPhone 16 Pro EXE Loader
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Reassemble Engine
        run: |
          mkdir -p ../FINAL_ENGINE_INJECTION
          cat EngineParts/wine_parts.* > wine_engine.zip
          unzip -q wine_engine.zip -d ../FINAL_ENGINE_INJECTION
          find ../FINAL_ENGINE_INJECTION -name "Info.plist" -delete
        
      - name: Build Minimalist Shell
        run: |
          cd Shell
          # Use Swift PM directly for the A18 Pro binary
          swift build -c release --triple arm64-apple-ios18.0-macabi
          
          # Create the .app structure manually
          mkdir -p build/WineKit.app
          cp .build/arm64-apple-macosx/release/WineKit build/WineKit.app/WineKit
          
          # Create a basic Info.plist so iOS knows what this is
          cat <<EOP > build/WineKit.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>WineKit</string>
              <key>CFBundleIdentifier</key>
              <string>com.yafrxc.WineKit</string>
              <key>CFBundleName</key>
              <string>WineKit</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>18.0</string>
          </dict>
          </plist>
          EOP
          
      - name: Final App Assembly
        run: |
          mkdir -p Payload
          cp -r Shell/build/WineKit.app Payload/
          
          # Inject the Engine
          mkdir -p "Payload/WineKit.app/wine"
          cp -r ../FINAL_ENGINE_INJECTION/* "Payload/WineKit.app/wine/"
          
          zip -r WineKit.ipa Payload
          
      - name: Upload A18 Pro IPA
        uses: actions/upload-artifact@v4
        with:
          name: WineKit-A18-Pro
          path: WineKit.ipa
