name: Build iPhone 16 Pro EXE Loader
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Reassemble Engine
        run: |
          mkdir -p ./engine_temp
          cat EngineParts/wine_parts.* > wine_engine.zip
          unzip -q wine_engine.zip -d ./engine_temp
        
      - name: Compile JIT Bridge & Shell
        run: |
          cd Shell/Sources/WineKit
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # 1. Compile C Bridge to an ARM64 Object File
          clang -target arm64-apple-ios17.0 -isysroot "$SDK_PATH" -c jit_trigger.c -o jit_trigger.o
          
          # 2. Compile Swift files and LINK the C object file
          # We use -import-objc-header to let Swift "see" the C function
          echo "void trigger_jit_bridge(void);" > bridging.h
          
          swiftc *.swift UI/*.swift jit_trigger.o \
            -target arm64-apple-ios17.0 \
            -sdk "$SDK_PATH" \
            -import-objc-header bridging.h \
            -O -o WineKit_Binary
          
      - name: Final App Assembly
        run: |
          rm -rf Payload
          mkdir -p Payload/WineKit.app/Frameworks
          mkdir -p Payload/WineKit.app/wine
          
          cp Shell/Sources/WineKit/WineKit_Binary Payload/WineKit.app/WineKit
          cp -R ./engine_temp/* Payload/WineKit.app/wine/
          
          # Create Info.plist
          cat <<EOP > Payload/WineKit.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
              <key>CFBundleExecutable</key><string>WineKit</string>
              <key>CFBundleIdentifier</key><string>com.yafrxc.WineKit</string>
              <key>CFBundleName</key><string>WineKit</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>MinimumOSVersion</key><string>17.0</string>
          </dict></plist>
          EOP
          
          chmod -R 777 Payload
          zip -r WineKit.ipa Payload
          
      - name: Upload JIT IPA
        uses: actions/upload-artifact@v4
        with:
          name: WineKit-Final
          path: WineKit.ipa
