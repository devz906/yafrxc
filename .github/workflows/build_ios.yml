name: Build iPhone 16 Pro EXE Loader
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Reassemble Engine Outside Source
        run: |
          # Extract to a folder at the ROOT, far away from the 'Shell' folder
          mkdir -p ../EXTRACTED_ENGINE_DATA
          cat EngineParts/wine_parts.* > wine_engine.zip
          unzip -q wine_engine.zip -d ../EXTRACTED_ENGINE_DATA
          # Delete the forbidden Info.plist files immediately
          find ../EXTRACTED_ENGINE_DATA -name "Info.plist" -delete
        
      - name: Build UI Shell
        run: |
          cd Shell
          # Build only the UI. Since the engine is currently in ../EXTRACTED_ENGINE_DATA,
          # Xcode won't see it and won't throw Error 74.
          xcodebuild archive \
            -scheme WineKit \
            -destination "generic/platform=iOS" \
            -archivePath ../WineKit.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
      - name: Manually Inject Engine & Wrap IPA
        run: |
          mkdir -p Payload
          # Find the .app folder
          APP_PATH=$(find WineKit.xcarchive -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          
          # Inject the engine data into the .app bundle manually
          APP_NAME=$(basename "$APP_PATH")
          cp -r ../EXTRACTED_ENGINE_DATA "Payload/$APP_NAME/engine_data"
          
          # Zip it up
          zip -r WineKit.ipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A18-Pro-WineKit-App
          path: WineKit.ipa
