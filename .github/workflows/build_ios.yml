name: Build iPhone 16 Pro EXE Loader
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Assemble Mega-Engine
        run: |
          # 1. Use a unique name for the staging area to avoid conflicts
          rm -rf ./staging_area
          mkdir -p ./staging_area
          
          # 2. Reassemble Wine Core parts (762MB)
          if ls EngineParts/wine_parts.* 1> /dev/null 2>&1; then
            cat EngineParts/wine_parts.* > wine_engine.zip
            unzip -q wine_engine.zip -d ./staging_area
          fi
          
          # 3. Copy the 'wine' source folder (Box64/MoltenVK/DLLs) 
          # We use a trailing slash to copy CONTENTS, not the folder itself
          if [ -d "wine" ]; then
            cp -RP wine/. ./staging_area/
          fi
          
          # 4. Copy extra Frameworks
          cp Shell/Frameworks/libMoltenVK.a ./staging_area/ 2>/dev/null || true
          
          chmod -R +x ./staging_area/
        
      - name: Compile JIT Bridge
        run: |
          cd Shell/Sources/WineKit
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -target arm64-apple-ios17.0 -isysroot "$SDK_PATH" -c jit_trigger.c -o jit_trigger.o
          echo "void trigger_jit_bridge(void);" > bridging.h
          swiftc *.swift UI/*.swift jit_trigger.o -target arm64-apple-ios17.0 -sdk "$SDK_PATH" -import-objc-header bridging.h -O -o WineKit
          
      - name: Final App Assembly
        run: |
          rm -rf Payload WineKit.ipa
          mkdir -p Payload/WineKit.app/Frameworks/wine_files
          
          # Move the compiled Swift binary
          cp Shell/Sources/WineKit/WineKit Payload/WineKit.app/WineKit
          
          # Move everything from staging to the app
          cp -RP ./staging_area/. Payload/WineKit.app/Frameworks/wine_files/
          
          # SIZE CHECK
          PAYLOAD_SIZE=$(du -sm Payload | cut -f1)
          echo "FINAL SIZE: $PAYLOAD_SIZE MB"
          
          # 1GB Fail-safe
          if [ "$PAYLOAD_SIZE" -lt 1000 ]; then
            echo "❌ ERROR: IPA is only $PAYLOAD_SIZE MB. Still missing parts!"
            exit 1
          fi
          
          cat <<EOP > Payload/WineKit.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
              <key>CFBundleExecutable</key><string>WineKit</string>
              <key>CFBundleIdentifier</key><string>com.yafrxc.WineKit</string>
              <key>CFBundleName</key><string>WineKit</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>MinimumOSVersion</key><string>17.0</string>
          </dict></plist>
          EOP
          
          find Payload/WineKit.app -type f \( -name "wine*" -or -name "box64*" -or -name "*.so" -or -name "*.dylib" \) -exec chmod +x {} +
          ditto -c -k --sequesterRsrc --keepParent Payload WineKit.ipa
          
      - name: Upload JIT IPA
        uses: actions/upload-artifact@v4
        with:
          name: WineKit-JIT-Final
          path: WineKit.ipa
