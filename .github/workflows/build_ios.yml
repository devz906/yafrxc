name: Build iPhone 16 Pro EXE Loader
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Kill Broken Symlinks
        run: |
          mkdir -p Shell/Sources/WineKit/Resources/
          if [ -d "Shell/Sources/WineKit/Resources/" ]; then
            find Shell/Sources/WineKit/Resources/ -type l -delete
            rm -rf Shell/Sources/WineKit/Resources/*
          fi
        
      - name: Reassemble Engine (Deep Safe Harbor)
        run: |
          mkdir -p ../FINAL_ENGINE_INJECTION
          cat EngineParts/wine_parts.* > wine_engine.zip
          unzip -q wine_engine.zip -d ../FINAL_ENGINE_INJECTION
          find ../FINAL_ENGINE_INJECTION -name "Info.plist" -delete
        
      - name: Build UI Shell
        run: |
          cd Shell
          # The fix: Force the deployment target to iOS 15.0
          xcodebuild archive \
            -scheme WineKit \
            -destination "generic/platform=iOS" \
            -archivePath ../WineKit.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
      - name: Final App Assembly
        run: |
          mkdir -p Payload
          APP_PATH=$(find WineKit.xcarchive -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          APP_NAME=$(basename "$APP_PATH")
          cp -r ../FINAL_ENGINE_INJECTION "Payload/$APP_NAME/engine_data"
          zip -r WineKit.ipa Payload
          
      - name: Upload A18 Pro IPA
        uses: actions/upload-artifact@v4
        with:
          name: WineKit-A18-Pro
          path: WineKit.ipa
