name: Build iPhone 16 Pro EXE Loader
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Reassemble Engine
        run: |
          mkdir -p ../FINAL_ENGINE_INJECTION
          cat EngineParts/wine_parts.* > wine_engine.zip
          unzip -q wine_engine.zip -d ../FINAL_ENGINE_INJECTION
        
      - name: Build Shell
        run: |
          cd Shell
          xcodebuild build \
            -scheme Shell \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
          
      - name: Final App Assembly
        run: |
          # 1. Create a dummy .app structure because xcodebuild-package sometimes only outputs the binary
          mkdir -p Payload/WineKit.app
          
          # 2. Find the compiled binary and move it into the bundle
          BINARY_PATH=$(find Shell/build -type f -perm +111 -name "WineKit" | head -n 1)
          echo "Found Binary at: $BINARY_PATH"
          cp "$BINARY_PATH" Payload/WineKit.app/WineKit
          
          # 3. Create a minimal Info.plist so iOS recognizes it
          cat <<EOP > Payload/WineKit.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>WineKit</string>
              <key>CFBundleIdentifier</key>
              <string>com.yafrxc.WineKit</string>
              <key>CFBundleName</key>
              <string>WineKit</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>18.0</string>
          </dict>
          </plist>
          EOP
          
          # 4. Inject the 700MB Engine
          mkdir -p "Payload/WineKit.app/wine"
          cp -r ../FINAL_ENGINE_INJECTION/* "Payload/WineKit.app/wine/"
          
          zip -r WineKit.ipa Payload
          
      - name: Upload A18 Pro IPA
        uses: actions/upload-artifact@v4
        with:
          name: WineKit-A18-Pro
          path: WineKit.ipa
