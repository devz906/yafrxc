name: Build iPhone 16 Pro EXE Loader
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Reassemble Engine in Safe Harbor
        run: |
          mkdir -p Shell/Sources/WineKit/Resources/
          # Stitch the parts in a separate folder first
          cat EngineParts/wine_parts.* > wine_engine.zip
          unzip -q wine_engine.zip -d extracted_engine
          # Move it to a subfolder that we will manually inject later
          mv extracted_engine Shell/Sources/WineKit/Resources/engine_data
        
      - name: Build IPA
        run: |
          cd Shell
          # Build the UI alone first (fast and clean)
          xcodebuild archive \
            -scheme WineKit \
            -destination "generic/platform=iOS" \
            -archivePath ../WineKit.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
          mkdir -p ../Payload
          APP_PATH=$(find ../WineKit.xcarchive -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" ../Payload/
          
          # Now manually inject the engine data into the IPA Payload
          # This bypasses the Xcode resource scanner errors
          cp -r Sources/WineKit/Resources/engine_data "../Payload/$(basename "$APP_PATH")/"
          
          cd ..
          zip -r WineKit.ipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A18-Pro-WineKit-App
          path: WineKit.ipa
