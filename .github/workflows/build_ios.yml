name: Build iPhone 16 Pro EXE Loader
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Reassemble Engine
        run: |
          mkdir -p ../FINAL_ENGINE_INJECTION
          cat EngineParts/wine_parts.* > wine_engine.zip
          unzip -q wine_engine.zip -d ../FINAL_ENGINE_INJECTION
        
      - name: Build Shell
        run: |
          cd Shell
          # We use xcodebuild but point it directly at the Package to generate the Scheme
          xcodebuild build \
            -scheme WineKit \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath ./build \
            IPHONEOS_DEPLOYMENT_TARGET=18.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
      - name: Final App Assembly
        run: |
          mkdir -p Payload
          APP_PATH=$(find Shell/build -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          APP_NAME=$(basename "$APP_PATH")
          
          mkdir -p "Payload/$APP_NAME/wine"
          cp -r ../FINAL_ENGINE_INJECTION/* "Payload/$APP_NAME/wine/"
          
          zip -r WineKit.ipa Payload
          
      - name: Upload A18 Pro IPA
        uses: actions/upload-artifact@v4
        with:
          name: WineKit-A18-Pro
          path: WineKit.ipa
