name: Build iPhone 16 Pro EXE Loader
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Reassemble Engine + GTA Parts
        run: |
          mkdir -p ./engine_temp
          
          # 1. Merge the 762MB Wine Core
          if ls EngineParts/wine_parts.* 1> /dev/null 2>&1; then
            cat EngineParts/wine_parts.* > wine_engine.zip
            unzip -q wine_engine.zip -d ./engine_temp
          fi
          
          # 2. Merge the GTA Engine Parts (Box64/MoltenVK)
          # Assuming they are in the 'wine' folder as you mentioned
          if [ -d "wine" ]; then
             cp -RP wine/* ./engine_temp/
          fi
          
          # 3. Double check for any loose box64/moltenvk files
          find . -name "box64*" -exec cp {} ./engine_temp/ \; 2>/dev/null || true
          find . -name "*MoltenVK*" -exec cp {} ./engine_temp/ \; 2>/dev/null || true
          
          chmod -R +x ./engine_temp/
        
      - name: Compile JIT Bridge & Shell
        run: |
          cd Shell/Sources/WineKit
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -target arm64-apple-ios17.0 -isysroot "$SDK_PATH" -c jit_trigger.c -o jit_trigger.o
          echo "void trigger_jit_bridge(void);" > bridging.h
          swiftc *.swift UI/*.swift jit_trigger.o \
            -target arm64-apple-ios17.0 \
            -sdk "$SDK_PATH" \
            -import-objc-header bridging.h \
            -O -o WineKit
          
      - name: Final App Assembly
        run: |
          rm -rf Payload WineKit.ipa
          mkdir -p Payload/WineKit.app/Frameworks/wine
          
          cp Shell/Sources/WineKit/WineKit Payload/WineKit.app/WineKit
          cp -RP ./engine_temp/* Payload/WineKit.app/Frameworks/wine/
          
          # This line is the truth-teller:
          echo "--- CHECKING FINAL SIZE ---"
          du -sh Payload
          
          # Info.plist
          cat <<EOP > Payload/WineKit.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
              <key>CFBundleExecutable</key><string>WineKit</string>
              <key>CFBundleIdentifier</key><string>com.yafrxc.WineKit</string>
              <key>CFBundleName</key><string>WineKit</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>MinimumOSVersion</key><string>17.0</string>
          </dict></plist>
          EOP
          
          # Fix executable permissions for the iPhone
          find Payload/WineKit.app -type f \( -name "wine*" -or -name "box64*" -or -name "*.so" -or -name "*.dylib" \) -exec chmod +x {} +
          
          ditto -c -k --sequesterRsrc --keepParent Payload WineKit.ipa
          
      - name: Upload JIT IPA
        uses: actions/upload-artifact@v4
        with:
          name: WineKit-JIT-Final
          path: WineKit.ipa
