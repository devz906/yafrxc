name: Build iPhone 16 Pro EXE Loader
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Reassemble Engine
        run: |
          mkdir -p ../FINAL_ENGINE_INJECTION
          cat EngineParts/wine_parts.* > wine_engine.zip
          unzip -q wine_engine.zip -d ../FINAL_ENGINE_INJECTION
        
      - name: Build Shell (Targeted SDK)
        run: |
          cd Shell
          # Get the path to the real iOS SDK
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # Build using the explicit SDK path and triple
          swift build -c release \
            --triple arm64-apple-ios17.0 \
            -Xswiftc -sdk -Xswiftc "$SDK_PATH"
          
      - name: Final App Assembly
        run: |
          mkdir -p Payload/WineKit.app
          
          # Find the binary in the Swift PM build folder
          BINARY_PATH=$(find Shell/.build/arm64-apple-ios17.0/release -type f -perm +111 -name "WineKit" | head -n 1)
          
          if [ -z "$BINARY_PATH" ]; then
            BINARY_PATH=$(find Shell/.build -type f -perm +111 -name "WineKit" | head -n 1)
          fi
          
          echo "Found Binary at: $BINARY_PATH"
          cp "$BINARY_PATH" Payload/WineKit.app/WineKit
          
          # Create Info.plist
          cat <<EOP > Payload/WineKit.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>WineKit</string>
              <key>CFBundleIdentifier</key>
              <string>com.yafrxc.WineKit</string>
              <key>CFBundleName</key>
              <string>WineKit</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>17.0</string>
          </dict>
          </plist>
          EOP
          
          # Inject Engine
          mkdir -p "Payload/WineKit.app/wine"
          cp -r ../FINAL_ENGINE_INJECTION/* "Payload/WineKit.app/wine/"
          
          zip -r WineKit.ipa Payload
          
      - name: Upload JIT IPA
        uses: actions/upload-artifact@v4
        with:
          name: WineKit-JIT-Ready
          path: WineKit.ipa
