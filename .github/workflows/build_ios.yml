name: Build iPhone 16 Pro EXE Loader
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Reassemble Engine
        run: |
          cd Shell/Sources/WineKit/Resources/
          cat wine_parts.* > wine_engine.zip
          unzip -q wine_engine.zip
          rm wine_parts.* wine_engine.zip
        
      - name: Build IPA
        run: |
          cd Shell
          # Force the compiler to target iOS 15.0+ to fix the 'close()' error
          xcodebuild archive \
            -scheme WineKit \
            -destination "generic/platform=iOS" \
            -archivePath ../WineKit.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_METHOD=manual
          
          mkdir -p ../Payload
          # Search for the .app folder inside the archive and move it to Payload
          APP_PATH=$(find ../WineKit.xcarchive -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" ../Payload/
          cd ..
          zip -r WineKit.ipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A18-Pro-WineKit-App
          path: WineKit.ipa
