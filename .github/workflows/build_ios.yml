name: Build iPhone 16 Pro EXE Loader
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Clean and Reassemble
        run: |
          # Move to resources and ensure NO loose wine folder exists
          cd Shell/Sources/WineKit/Resources/
          rm -rf wine
          # Stitch the parts
          cat wine_parts.* > wine_engine.zip
          unzip -q wine_engine.zip
          # IMPORTANT: Rename the unzipped folder to 'engine' to avoid Info.plist conflicts
          mv wine engine
          rm wine_parts.* wine_engine.zip
        
      - name: Build IPA
        run: |
          cd Shell
          xcodebuild archive \
            -scheme WineKit \
            -destination "generic/platform=iOS" \
            -archivePath ../WineKit.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
          mkdir -p ../Payload
          APP_PATH=$(find ../WineKit.xcarchive -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" ../Payload/
          cd ..
          zip -r WineKit.ipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A18-Pro-WineKit-App
          path: WineKit.ipa
