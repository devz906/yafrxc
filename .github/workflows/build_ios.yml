name: Build Split WineKit
on:
  push:
    branches: [ main ]

jobs:
  build_engine:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Titan Engine
        run: |
          mkdir -p titan_dist
          cat EngineParts/wine_parts.* > wine_core.zip
          unzip -q wine_core.zip -d titan_dist/
          if [ -d "wine" ]; then ditto wine titan_dist/wine/; fi
          cd titan_dist && zip -r ../TitanEngine_790MB.zip . && cd ..
          
      - name: Upload Engine Only
        uses: actions/upload-artifact@v4
        with:
          name: TitanEngine-Body
          path: TitanEngine_790MB.zip

  build_ui:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Tiny IPA
        run: |
          cd Shell/Sources/WineKit
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -target arm64-apple-ios17.0 -isysroot "$SDK_PATH" -c jit_trigger.c -o jit_trigger.o
          echo "void trigger_jit_bridge(void);" > bridging.h
          swiftc *.swift UI/*.swift jit_trigger.o -target arm64-apple-ios17.0 -sdk "$SDK_PATH" -import-objc-header bridging.h -O -o WineKit
          
          mkdir -p Payload/WineKit.app
          cp WineKit Payload/WineKit.app/WineKit
          
          cat <<EOP > Payload/WineKit.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
              <key>CFBundleExecutable</key><string>WineKit</string>
              <key>CFBundleIdentifier</key><string>com.yafrxc.WineKit</string>
              <key>CFBundleName</key><string>WineKit</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>UIFileSharingEnabled</key><true/>
          </dict></plist>
          EOP
          ditto -c -k --sequesterRsrc --keepParent Payload WineKit.ipa
          
      - name: Upload UI Only
        uses: actions/upload-artifact@v4
        with:
          name: WineKit-UI-Head
          path: WineKit.ipa
