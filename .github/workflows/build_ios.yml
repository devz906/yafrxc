name: Build iPhone 16 Pro EXE Loader
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Reassemble Engine
        run: |
          mkdir -p ./engine_temp
          cat EngineParts/wine_parts.* > wine_engine.zip
          unzip -q wine_engine.zip -d ./engine_temp
        
      - name: Force Compilation (Raw Swiftc)
        run: |
          cd Shell/Sources/WineKit
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc *.swift UI/*.swift \
            -target arm64-apple-ios17.0 \
            -sdk "$SDK_PATH" \
            -O -o WineKit_Binary
          
      - name: Final App Assembly
        run: |
          mkdir -p Payload/WineKit.app/Frameworks
          
          # 1. Move Wine Binary to Frameworks (The 'Safe Zone')
          cp ./engine_temp/wine Payload/WineKit.app/Frameworks/wine
          
          # 2. Copy everything else to the standard wine folder
          mkdir -p Payload/WineKit.app/wine
          cp -r ./engine_temp/* Payload/WineKit.app/wine/
          
          # 3. Copy Shell Binary
          cp Shell/Sources/WineKit/WineKit_Binary Payload/WineKit.app/WineKit
          
          # 4. The Nuclear Permission Unlock
          # We unlock EVERY file in the app bundle
          find Payload/WineKit.app -type f -exec chmod 777 {} +
          
          # 5. Create Info.plist with JIT Support
          cat <<EOP > Payload/WineKit.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>WineKit</string>
              <key>CFBundleIdentifier</key>
              <string>com.yafrxc.WineKit</string>
              <key>CFBundleName</key>
              <string>WineKit</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>17.0</string>
          </dict>
          </EOP>
          
          zip -r WineKit.ipa Payload
          
      - name: Upload JIT IPA
        uses: actions/upload-artifact@v4
        with:
          name: WineKit-JIT-Ready
          path: WineKit.ipa
