name: Build iPhone 16 Pro EXE Loader
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Reassemble Engine in Safe Harbor
        run: |
          # Stitch the parts in a separate folder that Xcode can't see
          mkdir -p extracted_engine
          cat EngineParts/wine_parts.* > wine_engine.zip
          unzip -q wine_engine.zip -d extracted_engine
          # Remove Info.plist from engine to avoid Apple security conflicts
          find extracted_engine -name "Info.plist" -delete
        
      - name: Build IPA
        run: |
          cd Shell
          # Build only the UI/Shell logic first (this will now be fast and clean)
          xcodebuild archive \
            -scheme WineKit \
            -destination "generic/platform=iOS" \
            -archivePath ../WineKit.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
          mkdir -p ../Payload
          APP_PATH=$(find ../WineKit.xcarchive -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" ../Payload/
          
          # MANUAL INJECTION: Slide the engine data into the app bundle
          # This bypasses the Resource Scanner entirely
          cp -r ../extracted_engine "../Payload/$(basename "$APP_PATH")/engine_data"
          
          cd ..
          zip -r WineKit.ipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A18-Pro-WineKit-App
          path: WineKit.ipa
