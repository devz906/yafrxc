name: Build iPhone 16 Pro EXE Loader
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Reassemble Engine
        run: |
          mkdir -p ./engine_temp
          cat EngineParts/wine_parts.* > wine_engine.zip
          unzip -q wine_engine.zip -d ./engine_temp
          chmod -R +x ./engine_temp/
        
      - name: Compile JIT Bridge & Shell
        run: |
          cd Shell/Sources/WineKit
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -target arm64-apple-ios17.0 -isysroot "$SDK_PATH" -c jit_trigger.c -o jit_trigger.o
          echo "void trigger_jit_bridge(void);" > bridging.h
          swiftc *.swift UI/*.swift jit_trigger.o \
            -target arm64-apple-ios17.0 \
            -sdk "$SDK_PATH" \
            -import-objc-header bridging.h \
            -O -o WineKit_Binary
          
      - name: Final App Assembly
        run: |
          # 1. Cleanup and Create Structure
          rm -rf Payload WineKit.ipa
          mkdir -p Payload/WineKit.app/Frameworks/wine
          
          # 2. Move Binary
          cp Shell/Sources/WineKit/WineKit_Binary Payload/WineKit.app/WineKit
          
          # 3. Copy Engine (Using -a to preserve links/attributes)
          cp -a ./engine_temp/. Payload/WineKit.app/Frameworks/wine/
          
          # 4. Generate Info.plist
          cat <<EOP > Payload/WineKit.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
              <key>CFBundleExecutable</key><string>WineKit</string>
              <key>CFBundleIdentifier</key><string>com.yafrxc.WineKit</string>
              <key>CFBundleName</key><string>WineKit</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>MinimumOSVersion</key><string>17.0</string>
          </dict></plist>
          EOP
          
          # 5. Permission Enforcement
          chmod +x Payload/WineKit.app/WineKit
          find Payload/WineKit.app/Frameworks/wine -name "wine*" -exec chmod +x {} +
          
          # 6. Verify and Zip
          du -sh Payload # This shows how big the folder is before zipping
          zip -ry WineKit.ipa Payload
          
      - name: Upload JIT IPA
        uses: actions/upload-artifact@v4
        with:
          name: WineKit-JIT-Ready
          path: WineKit.ipa
          if-no-files-found: error
