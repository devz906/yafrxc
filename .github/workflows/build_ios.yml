name: Titan Box64 Ultra-Cooker
on:
  push:
    branches: [ main ]

jobs:
  build_engine:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deep Cook Engine
        run: |
          mkdir -p final_engine/bin final_engine/lib
          
          # 1. Merge the main wine_parts (aa, ab, ac...)
          echo "Merging wine_parts..."
          cat EngineParts/wine_parts.* > wine_raw.zip
          unzip -q wine_raw.zip -d staging/
          
          # 2. Merge your custom wine folder from the repo
          if [ -d "wine" ]; then ditto wine staging/; fi
          
          # 3. DEEP UNZIP: Unpack the internal zips (moltenvk, assets, etc.)
          echo "Deep unpacking internal parts..."
          find staging -name "*.zip" -exec unzip -o -q {} -d staging/ \;
          
          # 4. CRITICAL: Find the actual binaries now that everything is open
          # Look for wine, wine64, box64, wineserver
          WINE_BIN=$(find staging -name "wine" -type f ! -name "*.*" | head -n 1)
          SERVER_BIN=$(find staging -name "wineserver" -type f | head -n 1)
          BOX_BIN=$(find staging -name "box64" -type f | head -n 1)
          
          echo "Chef Found: $WINE_BIN"
          echo "Server Found: $SERVER_BIN"
          echo "Box64 Found: $BOX_BIN"
          
          # 5. Move everything to final structure
          if [ ! -z "$WINE_BIN" ]; then cp "$WINE_BIN" final_engine/bin/wine; fi
          if [ ! -z "$SERVER_BIN" ]; then cp "$SERVER_BIN" final_engine/bin/wineserver; fi
          if [ ! -z "$BOX_BIN" ]; then cp "$BOX_BIN" final_engine/bin/box64; fi
          
          # Copy everything else (DLLs, libs)
          ditto staging/ final_engine/
          
          # 6. Set executable permissions
          chmod +x final_engine/bin/*
          
          cd final_engine && zip -r ../Titan-Box64-Cooked.zip . && cd ..
          
      - name: Upload Engine
        uses: actions/upload-artifact@v4
        with:
          name: Titan-Box64-Body
          path: Titan-Box64-Cooked.zip

  build_ui:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build IPA
        run: |
          cd Shell/Sources/WineKit
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -target arm64-apple-ios17.0 -isysroot "$SDK_PATH" -c jit_trigger.c -o jit_trigger.o
          echo "void trigger_jit_bridge(void);" > bridging.h
          swiftc *.swift UI/*.swift jit_trigger.o -target arm64-apple-ios17.0 -sdk "$SDK_PATH" -import-objc-header bridging.h -O -o WineKit
          mkdir -p Payload/WineKit.app
          cp WineKit Payload/WineKit.app/WineKit
          cat <<EOP > Payload/WineKit.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
              <key>CFBundleExecutable</key><string>WineKit</string>
              <key>CFBundleIdentifier</key><string>com.yafrxc.WineKit</string>
              <key>CFBundleName</key><string>TitanBox64</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>UIFileSharingEnabled</key><true/>
          </dict></plist>
          EOP
          ditto -c -k --sequesterRsrc --keepParent Payload TitanBox64.ipa
      - name: Upload UI
        uses: actions/upload-artifact@v4
        with:
          name: TitanBox64-UI
          path: TitanBox64.ipa
