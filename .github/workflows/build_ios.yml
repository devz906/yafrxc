name: Build iPhone 16 Pro EXE Loader
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Reassemble Engine
        run: |
          mkdir -p ../FINAL_ENGINE_INJECTION
          cat EngineParts/wine_parts.* > wine_engine.zip
          unzip -q wine_engine.zip -d ../FINAL_ENGINE_INJECTION
        
      - name: Build Shell
        run: |
          cd Shell
          xcodebuild build \
            -scheme Shell \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
          
      - name: Final App Assembly
        run: |
          mkdir -p Payload
          # The New Search: Look specifically in the Products/Release-iphoneos folder
          APP_PATH=$(find Shell/build/Build/Products/Release-iphoneos -name "*.app" -type d -maxdepth 2 | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Direct path failed, searching everywhere in build folder..."
            APP_PATH=$(find Shell/build -name "*.app" -type d | head -n 1)
          fi

          echo "Found prize at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          APP_NAME=$(basename "$APP_PATH")
          
          # Inject the 700MB Engine
          mkdir -p "Payload/$APP_NAME/wine"
          cp -r ../FINAL_ENGINE_INJECTION/* "Payload/$APP_NAME/wine/"
          
          zip -r WineKit.ipa Payload
          
      - name: Upload A18 Pro IPA
        uses: actions/upload-artifact@v4
        with:
          name: WineKit-A18-Pro
          path: WineKit.ipa
