name: Build iPhone 16 Pro EXE Loader
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Reassemble All Engines (Wine + Box64 + GTA)
        run: |
          mkdir -p ./engine_temp
          
          # 1. Merge Wine Parts
          if ls EngineParts/wine_parts.* 1> /dev/null 2>&1; then
            cat EngineParts/wine_parts.* > wine_engine.zip
            unzip -q wine_engine.zip -d ./engine_temp
          fi
          
          # 2. Merge Box64/GTA Parts (if they follow a similar pattern)
          # This catches anything ending in .aa, .ab, etc. in the root or folders
          find . -name "*.a[a-z]" -exec cat {} + > full_engine.zip 2>/dev/null || true
          
          # If full_engine exists, unzip it too
          if [ -f full_engine.zip ]; then
            unzip -o -q full_engine.zip -d ./engine_temp
          fi
          
          chmod -R +x ./engine_temp/
        
      - name: Compile JIT Bridge & Shell
        run: |
          cd Shell/Sources/WineKit
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -target arm64-apple-ios17.0 -isysroot "$SDK_PATH" -c jit_trigger.c -o jit_trigger.o
          echo "void trigger_jit_bridge(void);" > bridging.h
          swiftc *.swift UI/*.swift jit_trigger.o \
            -target arm64-apple-ios17.0 \
            -sdk "$SDK_PATH" \
            -import-objc-header bridging.h \
            -O -o WineKit
          
      - name: Final App Assembly
        run: |
          rm -rf Payload WineKit.ipa
          mkdir -p Payload/WineKit.app/Frameworks/wine
          cp Shell/Sources/WineKit/WineKit Payload/WineKit.app/WineKit
          
          cp -RP ./engine_temp/* Payload/WineKit.app/Frameworks/wine/
          
          # Check total size - WE WANT 1.4GB+
          PAYLOAD_SIZE=$(du -sm Payload | cut -f1)
          echo "TOTAL PAYLOAD SIZE: $PAYLOAD_SIZE MB"
          
          # Info.plist
          cat <<EOP > Payload/WineKit.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
              <key>CFBundleExecutable</key><string>WineKit</string>
              <key>CFBundleIdentifier</key><string>com.yafrxc.WineKit</string>
              <key>CFBundleName</key><string>WineKit</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>MinimumOSVersion</key><string>17.0</string>
          </dict></plist>
          EOP
          
          find Payload/WineKit.app/Frameworks/wine -type f \( -name "wine*" -or -name "*.so" -or -name "box64*" \) -exec chmod +x {} +
          ditto -c -k --sequesterRsrc --keepParent Payload WineKit.ipa
          
      - name: Upload JIT IPA
        uses: actions/upload-artifact@v4
        with:
          name: WineKit-JIT-Final
          path: WineKit.ipa
