name: Build iPhone 16 Pro EXE Loader
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Engine Archive
        run: |
          mkdir -p staging
          cat EngineParts/wine_parts.* > wine_core.zip
          unzip -q wine_core.zip -d staging/
          if [ -d "wine" ]; then ditto wine staging/extra_files; fi
          # Zip it all into one big file for the app to 'extract' to Documents
          cd staging && zip -r ../engine.zip . && cd ..
        
      - name: Compile Swift Shell
        run: |
          cd Shell/Sources/WineKit
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -target arm64-apple-ios17.0 -isysroot "$SDK_PATH" -c jit_trigger.c -o jit_trigger.o
          echo "void trigger_jit_bridge(void);" > bridging.h
          swiftc *.swift UI/*.swift jit_trigger.o -target arm64-apple-ios17.0 -sdk "$SDK_PATH" -import-objc-header bridging.h -O -o WineKit
          
      - name: Final Assembly
        run: |
          rm -rf Payload WineKit.ipa
          mkdir -p Payload/WineKit.app
          cp Shell/Sources/WineKit/WineKit Payload/WineKit.app/WineKit
          # Put the big zip inside the app resources
          cp engine.zip Payload/WineKit.app/engine.bundle
          
          cat <<EOP > Payload/WineKit.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
              <key>CFBundleExecutable</key><string>WineKit</string>
              <key>CFBundleIdentifier</key><string>com.yafrxc.WineKit</string>
              <key>CFBundleName</key><string>WineKit</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>UIFileSharingEnabled</key><true/>
              <key>LSSupportsOpeningDocumentsInPlace</key><true/>
          </dict></plist>
          EOP
          
          ditto -c -k --sequesterRsrc --keepParent Payload WineKit.ipa
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: WineKit-Universal
          path: WineKit.ipa
