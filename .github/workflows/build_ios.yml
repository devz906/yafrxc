name: Build iPhone 16 Pro EXE Loader
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Kill Broken Symlinks
        run: |
          # This specifically fixes the 'ignoring broken symlink' errors in your log
          find Shell/Sources/WineKit/Resources/ -type l -delete
          # Completely clear the Resources folder before Xcode starts
          rm -rf Shell/Sources/WineKit/Resources/*
        
      - name: Reassemble Engine (Deep Safe Harbor)
        run: |
          mkdir -p ../FINAL_ENGINE_INJECTION
          cat EngineParts/wine_parts.* > wine_engine.zip
          unzip -q wine_engine.zip -d ../FINAL_ENGINE_INJECTION
          # Delete Info.plist to prevent Error 74
          find ../FINAL_ENGINE_INJECTION -name "Info.plist" -delete
        
      - name: Build Bare-Metal Shell
        run: |
          cd Shell
          # We force -Onone to satisfy the indexer and speed up the A18 Pro build
          xcodebuild archive \
            -scheme WineKit \
            -destination "generic/platform=iOS" \
            -archivePath ../WineKit.xcarchive \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
      - name: Final App Assembly
        run: |
          mkdir -p Payload
          APP_PATH=$(find WineKit.xcarchive -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          APP_NAME=$(basename "$APP_PATH")
          # Inject the massive engine into the folder where the Swift code expects it
          cp -r ../FINAL_ENGINE_INJECTION "Payload/$APP_NAME/engine_data"
          zip -r WineKit.ipa Payload
          
      - name: Upload A18 Pro IPA
        uses: actions/upload-artifact@v4
        with:
          name: WineKit-A18-Pro
          path: WineKit.ipa
