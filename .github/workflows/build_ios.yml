name: Build iPhone 16 Pro EXE Loader
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Reassemble Engine
        run: |
          mkdir -p ../FINAL_ENGINE_INJECTION
          cat EngineParts/wine_parts.* > wine_engine.zip
          unzip -q wine_engine.zip -d ../FINAL_ENGINE_INJECTION
          find ../FINAL_ENGINE_INJECTION -name "Info.plist" -delete
        
      - name: Build UI Shell
        run: |
          cd Shell
          xcodebuild archive \
            -scheme WineKit \
            -destination "generic/platform=iOS" \
            -archivePath ./WineKit.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=18.0 \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
      - name: Final App Assembly
        run: |
          mkdir -p Payload
          # Search for the app inside the Shell folder where we just built it
          APP_PATH=$(find Shell/WineKit.xcarchive -name "*.app" -type d | head -n 1)
          echo "Found App at: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find .app bundle!"
            exit 1
          fi
          
          cp -r "$APP_PATH" Payload/
          APP_NAME=$(basename "$APP_PATH")
          
          # Inject engine into the bundle
          mkdir -p "Payload/$APP_NAME/wine"
          cp -r ../FINAL_ENGINE_INJECTION/* "Payload/$APP_NAME/wine/"
          
          zip -r WineKit.ipa Payload
          
      - name: Upload A18 Pro IPA
        uses: actions/upload-artifact@v4
        with:
          name: WineKit-A18-Pro
          path: WineKit.ipa
