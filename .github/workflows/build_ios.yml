name: Build iPhone 16 Pro EXE Loader
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Reassemble Engine
        run: |
          mkdir -p ../FINAL_ENGINE_INJECTION
          cat EngineParts/wine_parts.* > wine_engine.zip
          unzip -q wine_engine.zip -d ../FINAL_ENGINE_INJECTION
          find ../FINAL_ENGINE_INJECTION -name "Info.plist" -delete
        
      - name: Build Minimalist Shell
        run: |
          cd Shell
          # Direct build of the package to avoid Scheme/Archive errors
          xcodebuild build \
            -scheme WineKit \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath ./build \
            IPHONEOS_DEPLOYMENT_TARGET=18.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
      - name: Final App Assembly
        run: |
          mkdir -p Payload
          # Locate the built .app product in the derived data
          APP_PATH=$(find Shell/build -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then 
            echo "ERROR: App bundle not found! Build might have failed silently."
            exit 1
          fi
          
          cp -r "$APP_PATH" Payload/
          APP_NAME=$(basename "$APP_PATH")
          
          # Inject the 700MB Engine into the app bundle
          mkdir -p "Payload/$APP_NAME/wine"
          cp -r ../FINAL_ENGINE_INJECTION/* "Payload/$APP_NAME/wine/"
          
          zip -r WineKit.ipa Payload
          
      - name: Upload A18 Pro IPA
        uses: actions/upload-artifact@v4
        with:
          name: WineKit-A18-Pro
          path: WineKit.ipa
